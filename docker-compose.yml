services:

  mysql:
    image: mysql:8.0
    container_name: event-mysql

    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: eventdb
      MYSQL_USER: eventuser
      MYSQL_PASSWORD: eventpass

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    ports:
      - "3306:3306"

    networks:
      - event-network


  backend:
    build:
      context: ./backend

    container_name: event-backend

    environment:
      DB_HOST: mysql
      DB_USER: eventuser
      DB_PASSWORD: eventpass
      DB_NAME: eventdb

    ports:
      - "5000:5000"

    depends_on:
      - mysql

    networks:
      - event-network


  frontend:
    build:
      context: ./frontend

    container_name: event-frontend

    ports:
      - "80:80"

    depends_on:
      - backend

    networks:
      - event-network


  prometheus:
    image: prom/prometheus:latest

    container_name: prometheus

    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro

    ports:
      - "9090:9090"

    depends_on:
      - backend

    networks:
      - event-network


volumes:

  mysql_data:


networks:

  event-network:
